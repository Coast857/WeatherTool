# 这个工作流的名称，会显示在 GitHub 的 Actions 页面上
name: Weather API Auto Test Pipeline

# 触发条件配置
on:
  push:
    # 当代码推送到 master 或 main 分支时，自动触发此工作流
    branches:
      - master
      - main

# 定义需要执行的任务
jobs:
  # 任务名：自动化测试
  automated-test:
    # 指定运行此任务的云服务器操作系统，这里使用最新版 Ubuntu
    runs-on: ubuntu-latest

    # 具体的执行步骤
    steps:
      # 步骤1：将你 GitHub 仓库里的代码拉取到这台云服务器上
      - name: 📥 检出代码 (Checkout)
        uses: actions/checkout@v3

      # 步骤2：在云服务器上安装并配置 Python 环境
      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          # 指定 Python 版本
          python-version: '3.10'

      # 步骤3：根据 requirements.txt 安装第三方库
      - name: 📦 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤4：运行 Pytest 测试，并生成 Allure 的原始 JSON 数据到 allure-results 文件夹
      - name: 🚀 运行接口测试 (Pytest)
        # 即使测试有报错（比如接口断了），也要继续执行后面的生成报告步骤，否则报告出不来
        continue-on-error: true
        run: |
          pytest --alluredir=allure-results

      # 步骤5：借助第三方开源 Action，将 JSON 数据转换为 HTML 静态网页
      - name: 📊 生成 Allure 测试报告
        uses: simple-elf/allure-report-action@master
        # if: always() 确保无论测试用例成功还是失败，都会生成报告
        if: always()
        id: allure-report
        with:
          # 告诉插件原始数据在哪里
          allure-results: allure-results
          # 设置要生成的静态 HTML 存放的目录名叫 gh-pages
          gh-pages: gh-pages
          # 存放历史记录，让报告上能看到趋势图（成功率走势）
          allure-report: allure-report
          allure-history: allure-history

      # 步骤6：将生成的 HTML 网页自动部署到 GitHub Pages 上
      - name: 🌐 部署报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          # 提供 GitHub 自动生成的临时令牌，用于推送代码权限
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 要发布哪个文件夹的内容（上一步生成的 html 报告目录）
          publish_dir: allure-history